<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Jumoke’s 20th Birthday</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg1: #fff8ea;
      --bg2: #f3e8d3;
      --bg3: #e8dcc4;
      --paper: #f6f0e4;
      --ink: #4b2e1e;
      --muted: #765a45;
      --gold: #b88a44;
      --line: rgba(75, 46, 30, 0.2);
    }

    * { box-sizing: border-box; }

    html, body {
      min-height: 100%;
      margin: 0;
    }

    body {
      background:
        radial-gradient(1200px 600px at 50% 15%, var(--bg1) 0%, var(--bg2) 45%, var(--bg3) 100%),
        #f0e7d6;
      color: var(--ink);
      font-family: "IM Fell English", Georgia, serif;
      overflow: hidden;
    }

    button, input, select { font: inherit; }

    .page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
    }

    #stage-envelope,
    #stage-scroll {
      position: relative;
      width: min(700px, 94vw);
      max-width: 700px;
    }

    .instructions {
      margin: 12px 0 0;
      text-align: center;
      color: #6b4a2f;
      font-style: italic;
      letter-spacing: 0.3px;
    }

    .envelope-wrapper {
      position: relative;
      width: 100%;
    }

    #envelopeImg {
      position: relative;
      z-index: 1;
      display: block;
      width: 100%;
      height: auto;
      pointer-events: none;
      filter: contrast(1.08) brightness(1.03) saturate(1.08)
        drop-shadow(0 22px 50px rgba(0, 0, 0, 0.25));
      transition: opacity 0.6s ease, transform 0.6s ease;
    }

    .seal-hotspot {
      position: absolute;
      z-index: 2;
      left: 50%;
      top: 49%;
      width: clamp(70px, 16vw, 120px);
      height: clamp(70px, 16vw, 120px);
      transform: translate(-50%, -50%);
      border: 2px solid rgba(184, 138, 68, 0.18);
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.01);
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.2s ease;
    }

    .seal-hotspot:hover,
    .seal-hotspot:focus-visible {
      transform: translate(-50%, -50%) scale(1.03);
      border-color: rgba(184, 138, 68, 0.45);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.18);
      outline: none;
    }

    .seal-hotspot:active {
      transform: translate(-50%, -50%) scale(0.97);
    }

    #stage-scroll {
      display: none;
      opacity: 0;
      transform: translateY(10px) scale(0.98);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }

    #stage-scroll.show {
      display: block;
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .scroll {
      position: relative;
      width: 100%;
      padding: clamp(28px, 6vw, 48px) clamp(22px, 6vw, 52px);
      overflow: hidden;
      border: 1px solid rgba(75, 46, 30, 0.15);
      border-radius: 8px;
      background-color: var(--paper);
      background-image:
        repeating-linear-gradient(0deg, rgba(75, 46, 30, 0.045) 0 1px, transparent 1px 26px);
      box-shadow:
        0 18px 45px rgba(0, 0, 0, 0.28),
        inset 0 0 60px rgba(184, 138, 68, 0.15);
    }

    .eyebrow {
      margin: 0;
      text-align: center;
      color: var(--gold);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    h1, h2 {
      color: var(--ink);
      text-align: center;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.3);
    }

    h1 {
      margin: 10px 0 14px;
      font-family: "Great Vibes", cursive;
      font-size: clamp(42px, 8vw, 68px);
      font-weight: 400;
      line-height: 1.05;
    }

    h2 {
      margin: 4px 0 12px;
      font-size: clamp(24px, 4vw, 32px);
    }

    .invite {
      min-height: 145px;
      margin-top: 12px;
      text-align: center;
      font-size: clamp(17px, 2.8vw, 21px);
      line-height: 1.7;
    }

    .cursor {
      display: inline-block;
      width: 1ch;
      color: var(--ink);
      animation: blink 1s steps(1, end) infinite;
    }

    @keyframes blink { 50% { opacity: 0; } }

    .rsvp-area {
      margin-top: 24px;
      text-align: center;
    }

    .rsvp-button,
    .submit-rsvp {
      border: 1px solid var(--gold);
      background: var(--ink);
      color: var(--paper);
      text-transform: uppercase;
      letter-spacing: 2px;
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease, transform 0.2s ease;
    }

    .rsvp-button {
      min-width: 160px;
      padding: 13px 24px;
      font-size: 14px;
    }

    .rsvp-button:hover,
    .submit-rsvp:hover {
      background: transparent;
      color: var(--ink);
      transform: translateY(-1px);
    }

    #rsvpPanel {
      display: none;
      margin-top: 24px;
      padding-top: 24px;
      border-top: 1px solid var(--line);
      text-align: left;
    }

    #rsvpPanel.open { display: block; }

    .rsvp-subtitle {
      margin: 0 0 20px;
      color: var(--muted);
      text-align: center;
      font-size: 17px;
    }

    #rsvpForm {
      display: flex;
      max-width: 430px;
      margin: 0 auto;
      flex-direction: column;
      gap: 14px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .field label {
      color: var(--ink);
      font-size: 15px;
    }

    #rsvpForm input,
    #rsvpForm select {
      width: 100%;
      min-height: 48px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.5);
      color: var(--ink);
      font-size: 16px;
      outline: none;
    }

    #rsvpForm input:focus,
    #rsvpForm select:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(184, 138, 68, 0.12);
    }

    #guestField[hidden] { display: none; }

    .submit-rsvp {
      margin-top: 4px;
      padding: 14px 20px;
      font-size: 14px;
    }

    .note {
      max-width: 480px;
      margin: 22px auto 0;
      color: var(--muted);
      text-align: center;
      font-size: 15px;
      font-style: italic;
      line-height: 1.55;
    }

    .success-message {
      display: none;
      margin: 22px 0 0;
      color: var(--muted);
      text-align: center;
      font-size: 18px;
      font-style: italic;
      line-height: 1.6;
    }

    .success-message.show-message { display: block; }

    .fade-out {
      opacity: 0 !important;
      transform: scale(0.96) !important;
      pointer-events: none;
    }

    .vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(1200px 600px at 50% -10%, rgba(255, 255, 255, 0.16), transparent 50%),
        radial-gradient(1000px 480px at 50% 110%, rgba(184, 138, 68, 0.12), transparent 60%);
      mix-blend-mode: multiply;
    }

    @media (max-width: 520px) {
      .page { padding: 16px 10px; }
      .scroll { padding: 30px 20px; }
      .invite { min-height: 170px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <section id="stage-envelope" aria-label="Closed invitation envelope">
      <div class="envelope-wrapper">
        <img id="envelopeImg" src="envelope_transparent.png" alt="Sealed invitation envelope" />
        <button id="sealBtn" class="seal-hotspot" type="button" aria-label="Open the invitation"></button>
      </div>
      <p class="instructions">Click the seal to open your invitation.</p>
    </section>

    <section id="stage-scroll" aria-label="Birthday invitation" aria-live="polite">
      <article class="scroll">
        <p class="eyebrow">You are warmly invited</p>
        <h1>Jumoke’s 20th Birthday</h1>

        <div id="typed" class="invite"></div>
        <span id="caret" class="cursor" aria-hidden="true">|</span>

        <div id="rsvpArea" class="rsvp-area" hidden>
          <button id="rsvpBtn" class="rsvp-button" type="button" aria-expanded="false" aria-controls="rsvpPanel">
            RSVP
          </button>

          <div id="rsvpPanel">
            <h2>Kindly RSVP</h2>
            <p class="rsvp-subtitle">Please let me know if you’ll be joining me.</p>
            <form
  id="rsvpForm"
  name="birthday-rsvp"
  method="POST"
  data-netlify="true"
>
  <input
    type="hidden"
    name="form-name"
    value="birthday-rsvp"
  >
              <div class="field">
                <label for="guestName">Your name</label>
                <input id="guestName" name="name" type="text" autocomplete="name" required />
              </div>

              <div class="field">
                <label for="attendance">Will you be joining me?</label>
                <select id="attendance" name="attendance" required>
                  <option value="" selected disabled>Select your response</option>
                  <option value="Yes">YURRRRR!</option>
                  <option value="No">SOZ, NO.</option>
                </select>
              </div>

              <div id="guestField" class="field" hidden>
                <label for="additionalGuest">Will you be bringing a guest?</label>
                <select id="additionalGuest" name="additionalGuest">
                  <option value="No">No</option>
                  <option value="Yes - 1 guest">Yes, 1 guest</option>
                </select>
              </div>

              <button class="submit-rsvp" type="submit">Confirm RSVP</button>
            </form>

            <p class="note">
              Please note: the reservation is currently being confirmed. A £50 deposit per person will be requested once the reservation is confirmed.
            </p>

            <p id="successMessage" class="success-message" role="status"></p>
          </div>
        </div>
      </article>
    </section>
  </main>

  <div class="vignette" aria-hidden="true"></div>

  <script>
    (() => {
      const sealBtn = document.getElementById("sealBtn");
      const envelopeImg = document.getElementById("envelopeImg");
      const stageEnvelope = document.getElementById("stage-envelope");
      const stageScroll = document.getElementById("stage-scroll");
      const typed = document.getElementById("typed");
      const caret = document.getElementById("caret");
      const rsvpArea = document.getElementById("rsvpArea");
      const rsvpBtn = document.getElementById("rsvpBtn");
      const rsvpPanel = document.getElementById("rsvpPanel");
      const rsvpForm = document.getElementById("rsvpForm");
      const attendance = document.getElementById("attendance");
      const guestField = document.getElementById("guestField");
      const additionalGuest = document.getElementById("additionalGuest");
      const successMessage = document.getElementById("successMessage");

      const lines = [
        { text: "Saturday, 3 October 2026", pause: 450 },
        { text: "9:30 PM till late", pause: 450 },
        { text: "Gilgamesh · Covent Garden, London", pause: 650 },
        { text: "", pause: 200 },
        { text: "An evening of dinner, drinks & celebration.", pause: 350 }
      ];

      const characterDelay = 28;

      function typeLines(lineIndex = 0) {
        if (lineIndex >= lines.length) {
          caret.style.visibility = "hidden";
          rsvpArea.hidden = false;
          return;
        }

        const { text, pause } = lines[lineIndex];
        let characterIndex = 0;

        if (!text.length) {
          typed.appendChild(document.createElement("br"));
          window.setTimeout(() => typeLines(lineIndex + 1), pause);
          return;
        }

        function typeCharacter() {
          typed.append(document.createTextNode(text.charAt(characterIndex)));
          characterIndex += 1;

          if (characterIndex < text.length) {
            const jitter = Math.floor(Math.random() * 40);
            window.setTimeout(typeCharacter, characterDelay + jitter);
            return;
          }

          typed.appendChild(document.createElement("br"));
          window.setTimeout(() => typeLines(lineIndex + 1), pause);
        }

        typeCharacter();
      }

      function openInvite() {
        sealBtn.disabled = true;
        envelopeImg.classList.add("fade-out");

        window.setTimeout(() => {
          stageEnvelope.style.display = "none";
          stageScroll.classList.add("show");
          document.body.style.overflow = "auto";
          typeLines();
        }, 650);
      }

      function toggleRsvpPanel() {
        const isOpen = rsvpPanel.classList.toggle("open");
        rsvpBtn.setAttribute("aria-expanded", String(isOpen));
        rsvpBtn.textContent = isOpen ? "Close RSVP" : "RSVP";

        if (isOpen) {
          window.setTimeout(() => {
            rsvpPanel.scrollIntoView({ behavior: "smooth", block: "start" });
            document.getElementById("guestName").focus({ preventScroll: true });
          }, 100);
        }
      }

      function updateGuestQuestion() {
        const isAttending = attendance.value === "Yes";
        guestField.hidden = !isAttending;
        additionalGuest.disabled = !isAttending;

        if (!isAttending) {
          additionalGuest.value = "No";
        }
      }
      function submitRsvp() {

  setTimeout(() => {

    successMessage.textContent =
      "Thank you 🤍 Your RSVP has been received.";

    successMessage.classList.add("show-message");

  }, 500);

}

      sealBtn.addEventListener("click", openInvite);
      rsvpBtn.addEventListener("click", toggleRsvpPanel);
      attendance.addEventListener("change", updateGuestQuestion);
      rsvpForm.addEventListener("submit", submitRsvp);
    })();
  </script>
  <!-- Netlify Form Detection -->

<form name="birthday-rsvp" netlify hidden>
  <input type="text" name="name" />
  <input type="text" name="attendance" />
  <input type="text" name="additionalGuest" />
</form>
</body>
</html>
